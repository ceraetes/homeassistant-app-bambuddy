name: Update BamBuddy Dev add-on

on:
  repository_dispatch:
    types: [dev-image-pushed]
  schedule:
    - cron: '15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-dev
  cancel-in-progress: true

jobs:
  update-dev:
    name: Bump bambuddy-daily when :dev image changes
    runs-on: ubuntu-latest
    if: github.repository == 'ceraetes/homeassistant-app-bambuddy'

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Get dev image digest
        id: digest
        env:
          DISPATCH_DIGEST: ${{ github.event.client_payload.digest }}
        run: |
          if [ -n "$DISPATCH_DIGEST" ] && [ "$DISPATCH_DIGEST" != "null" ]; then
            DIGEST="$DISPATCH_DIGEST"
            echo "Using digest from repository_dispatch payload"
          else
            echo "Resolving digest via buildx imagetools inspect..."
            DIGEST=$(docker buildx imagetools inspect ghcr.io/ceraetes/bambuddy:dev --format '{{.Manifest.Digest}}')
          fi
          if [ -z "$DIGEST" ] || [ "$DIGEST" = "null" ]; then
            echo "ERROR: Could not resolve ceraetes/bambuddy:dev digest"
            exit 1
          fi
          SHORT=$(echo "$DIGEST" | cut -c8-15)
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "short=$SHORT" >> "$GITHUB_OUTPUT"
          echo "Dev image digest: $DIGEST"

      - name: Resolve APP_VERSION from fork
        id: app_version
        run: |
          APP_VERSION=$(curl -fsSL \
            "https://raw.githubusercontent.com/ceraetes/bambuddy/dev/backend/app/core/config.py" \
            | grep -oP 'APP_VERSION = "\K[^"]+' || true)
          if [ -z "$APP_VERSION" ]; then
            RELEASE_TAG=$(curl -s "https://api.github.com/repos/maziggy/bambuddy/releases?per_page=10" \
              | jq -r '[.[] | select(.prerelease == true)] | first | .tag_name' | sed 's/^v//')
            APP_VERSION=$(echo "$RELEASE_TAG" | sed 's/-daily\..*//')
          fi
          if [ -z "$APP_VERSION" ]; then
            echo "ERROR: Could not determine APP_VERSION"
            exit 1
          fi
          echo "version=$APP_VERSION" >> "$GITHUB_OUTPUT"
          echo "APP_VERSION: $APP_VERSION"

      - name: Build Supervisor version string
        id: new_version
        run: |
          DATE=$(date +%Y%m%d)
          NEW="${{ steps.app_version.outputs.version }}-dev.${DATE}.${{ steps.digest.outputs.short }}"
          echo "version=$NEW" >> "$GITHUB_OUTPUT"
          echo "New version: $NEW"

      - name: Get current version from config.yaml
        id: current
        run: |
          CURRENT=$(grep '^version:' bambuddy-daily/config.yaml | sed 's/.*"\(.*\)"/\1/')
          echo "version=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "Current version: $CURRENT"

      - name: Get changelog body
        id: changelog
        run: |
          RELEASE_JSON=$(curl -s "https://api.github.com/repos/maziggy/bambuddy/releases?per_page=10" \
            | jq '[.[] | select(.prerelease == true)] | first')
          BODY=$(echo "$RELEASE_JSON" | jq -r '.body // empty')
          if [ -z "$BODY" ] || [ "$BODY" = "null" ]; then
            BODY="Dev image \`${{ steps.digest.outputs.digest }}\` built from [ceraetes/bambuddy](https://github.com/ceraetes/bambuddy) \`dev\` @ \`${{ github.event.client_payload.ref || 'see Actions' }}\`."
          fi
          echo "body<<EOF" >> "$GITHUB_OUTPUT"
          echo "$BODY" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Update config.yaml
        if: steps.new_version.outputs.version != steps.current.outputs.version
        run: |
          sed -i 's/^version: ".*"/version: "${{ steps.new_version.outputs.version }}"/' bambuddy-daily/config.yaml
          echo "config.yaml -> ${{ steps.new_version.outputs.version }}"

      - name: Update CHANGELOG.md
        if: steps.new_version.outputs.version != steps.current.outputs.version
        run: |
          python3 - <<'PYEOF'
          import os
          version = os.environ["NEW_VERSION"]
          body = os.environ.get("NEW_BODY", "")
          with open("bambuddy-daily/CHANGELOG.md", "w") as f:
              f.write(f"## {version}\n\n{body}\n\n")
          print("CHANGELOG.md updated")
          PYEOF
        env:
          NEW_VERSION: ${{ steps.new_version.outputs.version }}
          NEW_BODY: ${{ steps.changelog.outputs.body }}

      - name: Record dev image digest
        if: steps.new_version.outputs.version != steps.current.outputs.version
        run: |
          echo "${{ steps.digest.outputs.digest }}" > .github/dev-image-digest

      - name: Commit and push
        if: steps.new_version.outputs.version != steps.current.outputs.version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bambuddy-daily/config.yaml bambuddy-daily/CHANGELOG.md .github/dev-image-digest
          git diff --staged --quiet || git commit -m "chore: update BamBuddy Dev ${{ steps.current.outputs.version }} → ${{ steps.new_version.outputs.version }}"
          git push

      - name: No update needed
        if: steps.new_version.outputs.version == steps.current.outputs.version
        run: echo "Supervisor version unchanged — add-on store already at ${{ steps.current.outputs.version }}"
